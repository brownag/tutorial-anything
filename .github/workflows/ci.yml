name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: lint + examples + tests (${{ matrix.os }}, python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04  # python 3.9 has no setup-python build for ubuntu 26.04
            python-version: "3.9"
          - os: ubuntu-24.04
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Tool versions
        run: |
          python3 --version
          git --version
          make --version | head -1

      - name: Lint
        run: make lint

      - name: Validate examples
        run: make validate-examples

      - name: Test corpus
        run: make test-corpus

      - name: Test
        run: make test
