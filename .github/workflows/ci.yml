name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: lint + examples + tests (${{ matrix.os }}, python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04  # python 3.9 has no setup-python build for ubuntu 26.04
            python-version: "3.9"
          - os: ubuntu-24.04
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Tool versions
        run: |
          python3 --version
          git --version
          make --version | head -1

      - name: Lint
        run: make lint

      - name: Validate examples
        run: make validate-examples

      - name: Test corpus
        run: make test-corpus

      - name: Test
        run: make test

  windows-test:
    name: lint + examples + tests (windows-latest, python 3.12)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: interactive-tutorial
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tool versions
        run: |
          python --version
          git --version

      - name: Lint
        run: python -m py_compile scripts/dag_manager.py tests/test_dag*.py

      - name: Validate examples
        run: |
          python scripts/dag_manager.py --file examples/expected-dag.json validate
          python scripts/dag_manager.py --file examples/expected-dag.json status >/dev/null

      - name: Test
        run: python -m unittest discover -s tests -p "test_dag*.py" -v
